name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run governance pipeline
        run: python run_demo.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Acceptance checks
        run: python run_demo.py verify

      - name: Show key results
        run: |
          python - <<'PY'
          import json
          q = json.load(open("reports/quality_result.json", encoding="utf-8"))
          print("health:", q["before"]["summary"]["overall_health"], "->", q["after"]["summary"]["overall_health"])
          print("recall:", q["effectiveness"]["summary"]["recall"])
          print("closure:", q["closure"])
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-reports-py${{ matrix.python-version }}
          path: |
            reports/
            data/raw/
            data/serving/
          retention-days: 14
